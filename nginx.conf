server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on; gzip_types text/html application/javascript application/manifest+json; gzip_min_length 1000;
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location ~* \.(png|webmanifest)$ { add_header Cache-Control "public, max-age=86400"; }
}
