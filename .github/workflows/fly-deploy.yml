name: Deploy to Fly.io
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no Fly token is set (the app is deployed from the Fly dashboard instead)
        id: tok
        run: if [ -z "$FLY_API_TOKEN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "No FLY_API_TOKEN secret - skipping"; fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.tok.outputs.skip != '1'
      - run: flyctl deploy --remote-only
        if: steps.tok.outputs.skip != '1'
